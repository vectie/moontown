apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: town-public-upstream, namespace: aigc-acceptance-20260915}
spec:
  replacePathRegex:
    regex: '^/town/(.*)$'
    replacement: '/moontown/${1}'
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: town-root-slash, namespace: aigc-acceptance-20260915}
spec:
  redirectRegex:
    regex: '^https?://([^/]+)/town(\?.*)?$'
    replacement: 'https://${1}/town/${2}'
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: town-private-entry, namespace: aigc-acceptance-20260915}
spec:
  redirectRegex:
    regex: '^https?://([^/]+)/town/workspace/?(.*)$'
    replacement: 'https://${1}/moontown/workspace/${2}'
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: town-public, namespace: aigc-acceptance-20260915}
spec:
  entryPoints: [websecure]
  tls: {secretName: lunanexa-public-suanli-tls}
  routes:
    - kind: Rule
      match: 'Host(`suanli.kechuangfuwu.com`) && Path(`/town`)'
      priority: 120
      middlewares: [{name: town-root-slash}]
      services: [{name: moontown-platform, port: 8082}]
    - kind: Rule
      match: 'Host(`suanli.kechuangfuwu.com`) && PathPrefix(`/town/`) && !(Path(`/town/workspace`) || PathPrefix(`/town/workspace/`))'
      priority: 120
      middlewares: [{name: town-public-upstream}]
      services: [{name: moontown-platform, port: 8082}]
    - kind: Rule
      match: 'Host(`suanli.kechuangfuwu.com`) && (Path(`/town/workspace`) || PathPrefix(`/town/workspace/`)) && (Method(`GET`) || Method(`HEAD`))'
      priority: 151
      middlewares: [{name: town-private-entry}]
      services: [{name: moontown-webide-gateway, port: 8082}]
