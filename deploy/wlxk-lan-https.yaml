# Pair with a LAN DNS override: suanli.kechuangfuwu.com -> 192.168.2.173.
# The public 8443 mapping terminates at LAN port 443; LAN clients need 8443 too.
apiVersion: v1
kind: Service
metadata:
  name: platform-lan-https-8443
  namespace: kube-system
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/instance: traefik-kube-system
    app.kubernetes.io/name: traefik
  ports:
    - name: https
      port: 8443
      targetPort: websecure
      protocol: TCP
