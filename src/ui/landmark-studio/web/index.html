<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>MoonTown · 建筑 3D</title>
<link rel="stylesheet" href="studio.css"><link rel="stylesheet" href="viewer-ui.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}</script>
</head><body class="viewer viewer-architecture">
<header class="masthead viewer-header"><a class="brand" href="#center" aria-label="建筑模型首页"><span data-icon="cube"></span><span>MoonTown · 建筑</span></a><span class="viewer-badge">设计模型</span></header>
<main><aside class="inspector viewer-inspector">
  <h1 id="title">未来中心</h1><p>拖拽环视，查看建筑与周边环境。</p>
  <button id="references"><span data-icon="photo"></span>参考图</button>
  <div class="viewer-links"><a id="interior-link" href="interior.html" class="viewer-link"><span data-icon="indoor"></span>室内</a><a href="datacenter.html" class="viewer-link"><span data-icon="server"></span>数据中心</a></div>
  <details class="viewer-advanced"><summary>高级</summary><div class="viewer-advanced-body">
    <h2>显示设置</h2><div class="segments" role="group" aria-label="光照"><button data-light="day" aria-pressed="true">日光</button><button data-light="golden" aria-pressed="false">暖光</button><button data-light="blue" aria-pressed="false">夜景</button></div>
    <div class="toggle-row"><label for="context">周边环境</label><input id="context" type="checkbox" checked></div><div class="toggle-row"><label for="clay">白模</label><input id="clay" type="checkbox"></div><div class="toggle-row"><label for="rotate">自动环视</label><input id="rotate" type="checkbox"></div>
    <h3>更多视角</h3><div class="viewer-links" role="group" aria-label="更多视角"><button data-view="front" aria-pressed="false">正面</button><button data-view="side" aria-pressed="false">侧面</button><button data-view="reverse" aria-pressed="false">背面</button><button id="projection" aria-pressed="false">正交</button></div>
    <h3>模型依据</h3><p><span id="ordinal"></span> · <span id="subtitle"></span></p><p id="description"></p><p id="note"></p><p id="reference-count"></p><p>建筑与环境为参考资料重建，不是测绘或竣工模型。小镇使用对应的二维投影，完整模型在这里保留。</p>
    <h3>操作帮助</h3><p>拖拽旋转，滚轮缩放，右键拖拽平移。方向键旋转，＋／－缩放，Home 复位。</p><p>局部轴向不代表测绘正北。MoonBit 几何 · Three.js 渲染。</p>
  </div></details>
</aside><section id="viewport" aria-label="交互式建筑模型">
  <canvas id="scene" tabindex="0" aria-label="拖拽旋转，滚轮缩放，右键平移；方向键旋转，加减号缩放，Home复位"></canvas>
  <div class="viewer-camera" role="group" aria-label="视角"><button data-view="hero" class="selected" aria-pressed="true"><span data-icon="cube"></span>总览</button><button data-view="detail" aria-pressed="false"><span data-icon="fit"></span>细节</button><button data-view="top" aria-pressed="false"><span data-icon="top"></span>俯视</button><button id="reset" class="viewer-icon-button" aria-label="复位视角" title="复位视角 (Home)"><span data-icon="reset"></span></button></div>
  <span id="north-arrow" hidden></span><div id="loading" class="loading" role="status"><span class="spinner"></span>正在加载建筑模型…</div><div class="viewer-hint">拖拽旋转 · 滚轮缩放</div><div class="view-status" id="view-status" aria-live="polite"></div>
</section></main>
<nav class="landmarks" aria-label="选择地标"><button data-study="center" aria-pressed="true"><strong>未来中心</strong></button><button data-study="vision" aria-pressed="false"><strong>未来视界</strong></button><button data-study="east-bridge" aria-pressed="false" title="未来科学城东路桥"><strong>东路桥</strong></button><button data-study="arch-bridge" aria-pressed="false" title="未来科学城路桥"><strong>科学城路桥</strong></button></nav>
<dialog id="reference-dialog" aria-labelledby="reference-title"><div class="dialog-head"><h2 id="reference-title">参考图</h2><button id="close-references" class="viewer-icon-button" aria-label="关闭参考图" title="关闭"><span data-icon="close"></span></button></div><p class="dialog-intro">照片与图纸来自原发布者，点击查看原图。</p><div id="reference-grid"></div></dialog>
<script type="module" src="studio.js"></script></body></html>
